name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev --extra mcp
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync agent-lab eval --report reports/eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.python-version }}
          path: reports/eval.json

  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: docker pull python:3.12-slim
      - run: uv run --no-sync python scripts/sandbox_smoke.py
