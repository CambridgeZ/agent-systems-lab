[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-systems-lab"
version = "0.1.0"
description = "A readable coding-agent harness: tools, RAG, approvals, recovery and evaluations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "anthropic>=0.49,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]
mcp = ["mcp>=1.12,<2"]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
treesitter = ["tree-sitter-language-pack>=0.7"]
tui = ["prompt-toolkit>=3.0", "rich>=13.7"]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
